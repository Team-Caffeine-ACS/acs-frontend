name: Frontend Coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm test

      # ❗ IMPORTANT:
      # SonarCloud GitHub App will automatically pick up the analysis.
      # We DO NOT run sonar-scanner or SonarCloud GitHub Action here.
      # This prevents double analysis.

      - name: Upload coverage artifact (optional but useful)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/lcov.info
