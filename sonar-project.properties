sonar.projectKey=Team-Caffeine-ACS_acs-frontend
sonar.organization=team-caffeine-acs

# Source files
sonar.sources=src

# Test files
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx

# Coverage (Jest + Istanbul)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Optional but useful
sonar.exclusions=**/node_modules/**,jest.config.js